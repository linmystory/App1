name: Build APK and AAB from ZIP

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Lấy dữ liệu kho lưu trữ
      uses: actions/checkout@v4

    - name: Cài đặt môi trường Java (LTS)
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Tự động giải nén mã nguồn
      run: |
        if [ -f "code.zip" ]; then
          echo "Đang giải nén tệp code.zip..."
          unzip -o code.zip -d .
        else
          echo "Không tìm thấy code.zip, sử dụng mã nguồn trực tiếp từ repository."
        fi

    - name: Giải mã chìa khóa ký (Keystore)
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > keystore.jks

    - name: Cấp quyền thực thi cho Gradle
      run: chmod +x gradlew

    - name: Đóng gói APK và AAB
      run: |
        ./gradlew bundleRelease assembleRelease \
          -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/keystore.jks \
          -Pandroid.injected.signing.store.password="${{ secrets.KEYSTORE_PASSWORD }}" \
          -Pandroid.injected.signing.key.alias="${{ secrets.KEY_ALIAS }}" \
          -Pandroid.injected.signing.key.password="${{ secrets.KEY_PASSWORD }}"

    - name: Lưu trữ thành phẩm (APK & AAB)
      uses: actions/upload-artifact@v4
      with:
        name: app-release-files
        path: |
          app/build/outputs/bundle/release/*.aab
          app/build/outputs/apk/release/*.apk
        retention-days: 30
e/*.apk
